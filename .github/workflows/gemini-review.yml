name: Gemini Lead Tester Review

# Gemini draait als reviewer op elke PR (cloud-agent zonder repo-connector, ADR-0007).
# LET OP (AVG): dit stuurt de PR-diff naar de externe Google Gemini API. Dat is
# uitsluitend toegestaan omdat deze repo per ADR-0004/0005 NOOIT echte PII bevat
# (alleen synthetische data). De 'PII-voorwacht'-stap hieronder is defense-in-depth:
# vindt hij toch persoonsgegevens in de diff, dan faalt de job en gaat er niets naar buiten.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Haal Git Diff op
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: PII-voorwacht (ADR-0005) — stop vóór externe verzending
        run: node mistral-lokaal/scripts/pii_scan --diff-base "origin/${{ github.base_ref }}"

      - name: Stuur Diff naar Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash   # actueel model (aug 2026); bij 404 toont het log de beschikbare modellen voor jouw key
        run: |
          INTRO="Je bent de Lead Tester in een softwareontwikkelingsteam voor een VvE-stem/presentie-app (server-side stemverwerking in MariaDB, atomair sluiten, quorum en gekwalificeerde meerderheden). Analyseer onderstaande code-diff. Schrijf concrete suggesties voor unit-tests, randgevallen (edge cases) en risico's, met bijzondere aandacht voor race-condities bij gelijktijdig stemmen en voor server-side autorisatie per eigenaarsgroep. Sluit je antwoord af met exact een van deze twee machine-leesbare regels, zonder tekst erna: VERDICT: APPROVE wanneer er geen blokkerende bevindingen zijn, of VERDICT: REQUEST_CHANGES wanneer aanpassingen nodig zijn. Licht een REQUEST_CHANGES vóór de verdictregel kort toe:"
          jq -n --arg intro "$INTRO" --rawfile diff pr_diff.txt \
            '{ contents: [{ parts: [{ text: ($intro + "\n\n" + $diff) }] }] }' \
            > payload.json

          # Roep de API aan met exponentiële backoff op rate-limits en tijdelijke serverfouten.
          # De respons-body bevat de API-key NIET; Actions-logs zijn privé voor collaborators.
          URL="https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}"
          HTTP_CODE=""
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json -X POST "$URL" \
              -H "Content-Type: application/json" --data-binary @payload.json)
            echo "Poging $attempt — HTTP $HTTP_CODE (model: ${GEMINI_MODEL})"
            if [ "$HTTP_CODE" = "200" ]; then break; fi
            case "$HTTP_CODE" in
              000|429|500|502|503|504)
                if [ "$attempt" -lt 5 ]; then
                  WAIT=$((10 * (1 << (attempt - 1))))
                  echo "Tijdelijke Gemini-fout HTTP $HTTP_CODE — wacht ${WAIT}s en probeer opnieuw..."
                  sleep "$WAIT"
                  continue
                fi
                ;;
            esac
            break   # permanente fout of alle tijdelijke pogingen verbruikt
          done

          echo "----- Ruwe API-respons (diagnose) -----"
          cat response.json
          echo ""
          echo "---------------------------------------"

          if [ "$HTTP_CODE" != "200" ]; then
            if [ "$HTTP_CODE" = "404" ]; then
              echo "Model '${GEMINI_MODEL}' niet gevonden. Beschikbare modellen voor deze key die generateContent ondersteunen:"
              curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" \
                | jq -r '.models[]? | select(.supportedGenerationMethods[]? == "generateContent") | .name' || true
            fi
            echo "::error::Gemini API eindigde op HTTP $HTTP_CODE. 404=modelnaam onbekend (zie lijst hierboven, zet die in GEMINI_MODEL), 429=quota, 500/502/503/504=tijdelijke servercapaciteit, 403=key/permissies, 400=payload. Zie respons hierboven."
            exit 1
          fi

          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // empty' response.json)
          if [ -z "$REVIEW" ]; then
            echo "::error::HTTP 200 maar geen review-tekst (mogelijk safety-block of leeg antwoord). Zie ruwe respons hierboven."
            exit 1
          fi
          printf '%s' "$REVIEW" > review_output.txt

      - name: Bepaal formeel reviewverdict fail-closed
        id: verdict
        run: python scripts/parse_gemini_verdict.py review_output.txt --github-output "$GITHUB_OUTPUT"

      - name: Plaats formele Gemini-review
        uses: actions/github-script@v7
        env:
          REVIEW_EVENT: ${{ steps.verdict.outputs.event }}
          VERDICT_VALID: ${{ steps.verdict.outputs.valid }}
        with:
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review_output.txt', 'utf8');
            const event = process.env.REVIEW_EVENT;
            if (!['APPROVE', 'REQUEST_CHANGES'].includes(event)) {
              core.setFailed(`Onveilig of onbekend review-event: ${event}`);
              return;
            }
            const failClosedNote = process.env.VERDICT_VALID === 'true'
              ? ''
              : '\n\n> De verdict-trailer ontbrak, was dubbelzinnig of stond niet als laatste regel; daarom is fail-closed om wijzigingen gevraagd.';
            await github.rest.pulls.createReview({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_id: context.payload.pull_request.head.sha,
              event,
              body: `### 🧪 Gemini Lead Tester Review\n\n${reviewText}${failClosedNote}`
            });
