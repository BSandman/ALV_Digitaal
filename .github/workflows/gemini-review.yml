name: Gemini Lead Tester Review

# Gemini draait als reviewer op elke PR (cloud-agent zonder repo-connector, ADR-0007).
# LET OP (AVG): dit stuurt de PR-diff naar de externe Google Gemini API. Dat is
# uitsluitend toegestaan omdat deze repo per ADR-0004/0005 NOOIT echte PII bevat
# (alleen synthetische data). De 'PII-voorwacht'-stap hieronder is defense-in-depth:
# vindt hij toch persoonsgegevens in de diff, dan faalt de job en gaat er niets naar buiten.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Haal Git Diff op
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: PII-voorwacht (ADR-0005) — stop vóór externe verzending
        run: |
          # Faal als de diff patronen bevat die op echte persoonsgegevens of
          # runtime-databestanden wijzen. Zo verlaat er nooit PII de repo.
          if grep -Eiq '([a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,})' pr_diff.txt \
             || grep -Eiq '(owners\.js|owners\.initial\.js|events\.json|audit\.log|cycle\.json|snapshots/)' pr_diff.txt; then
            echo "::error::PII-voorwacht: mogelijke persoonsgegevens/runtime-data in de diff. Verzending naar externe API geblokkeerd (ADR-0005)."
            exit 1
          fi
          echo "PII-voorwacht schoon."

      - name: Stuur Diff naar Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DIFF_CONTENT=$(jq -sR . pr_diff.txt)
          PROMPT="Je bent de Lead Tester in een softwareontwikkelingsteam voor een VvE-stem/presentie-app (server-side stemverwerking in MariaDB, atomair sluiten, quorum en gekwalificeerde meerderheden). Analyseer onderstaande code-diff. Schrijf concrete suggesties voor unit-tests, randgevallen (edge cases) en risico's, met bijzondere aandacht voor race-condities bij gelijktijdig stemmen en voor server-side autorisatie per eigenaarsgroep:\n\n$DIFF_CONTENT"
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{ contents: [{ parts: [{ text: $prompt }] }] }')
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > response.json
          jq -r '.candidates[0].content.parts[0].text // "‼️ Geen bruikbaar antwoord van de Gemini API (controleer GEMINI_API_KEY en quota)."' response.json > review_output.txt

      - name: Plaats Feedback als PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Gemini Lead Tester Review\n\n${reviewText}`
            });
