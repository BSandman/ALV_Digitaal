name: T-run architecture and privacy gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  handoff-lint:
    name: Handoff state guardrail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python-guardrails, begrensde context en notifier
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verifieer live P0a-mergeveiligheid en sprintreservatie
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_AUTOMERGE: ${{ vars.PIPELINE_AUTOMERGE }}
        run: |
          set -euo pipefail
          workflow_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-autoadvance.yml" \
            --jq '.state')"
          require_up_to_date="$(gh api \
            "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" \
            --jq '.strict')"
          python scripts/pipeline_guard.py setup \
            --metadata config/pipeline-sprint.json \
            --repository "$GITHUB_REPOSITORY" \
            --runtime-automerge "$PIPELINE_AUTOMERGE"
          python scripts/pipeline_guard.py live-safety \
            --repository-variable "$PIPELINE_AUTOMERGE" \
            --workflow-state "$workflow_state" \
            --require-branches-up-to-date "$require_up_to_date"

      - name: Valideer huidige handoff
        run: python scripts/lint_handoff.py handoff.md

  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout volledige historie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installeer reproduceerbare dependencies
        run: npm ci --prefix app --no-audit --no-fund

      - name: Rode en groene regressietests
        run: npm test --prefix app

      - name: Gate A — ADR-0002
        run: npm run gate:architecture --prefix app

      - name: Bouw code-only release-artefact
        run: npm run build:release --prefix app

      - name: CloudLinux in-place deploy en rollback
        shell: bash
        run: bash tests/deploy-in-place.integration.sh dist/alv-digitaal-app-v0.2.0.tgz

      - name: Idempotente CloudLinux-provisioning
        shell: bash
        run: bash tests/provision-env.integration.sh

      - name: Gate B — diff, fixtures en release-artefact
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          node mistral-lokaal/scripts/pii_scan \
            --diff-base "$BASE" \
            --fixtures tests/fixtures \
            --artifact dist

      - name: Bewaar gecontroleerd release-artefact
        uses: actions/upload-artifact@v4
        with:
          name: alv-digitaal-code-only
          path: dist/*.tgz
          if-no-files-found: error
