# Digitaal ALV-eigenaarportaal — dev/test/CI-omgeving
# Doel: mijn.host .starter (shared hosting) nabootsen, NIET vervangen.
# Productie draait GEEN Docker. Zie docs/Architectuur_en_infravoorstel_v0.2.0.md §4.
#
# Gebruik:
#   docker compose up                    -> basisrun (app + db + proxy), zo licht als productie
#   docker compose --profile dev up      -> incl. Adminer voor DB-inspectie
#   docker compose --profile loadtest run --rm alv-loadtest   -> 120-clients stemburst
#   docker compose --profile dev --profile loadtest up -> volledige T-run in één commando
#
# DB-versie BEVESTIGD op productie: MariaDB 11.8.8 (CloudLinux LVE), lokale UNIX-socket.

name: alv-digitaal

services:
  alv-seed-prepare:
    image: node:20-bookworm-slim
    container_name: alv-seed-prepare
    restart: "no"
    command:
      - node
      - /seed-tools/prepare-seed.mjs
      - --schema
      - /seed-fallback/01-schema.sql
      - --fallback
      - /seed-fallback/02-seed-synthetic.sql
      - --mistral-root
      - /mistral
      - --output
      - /prepared
    volumes:
      - ./mysql/prepare-seed.mjs:/seed-tools/prepare-seed.mjs:ro
      - ./mysql/init:/seed-fallback:ro
      - ../mistral-lokaal:/mistral:ro
      - alv-db-init:/prepared
    networks: [alv-net]

  alv-db:
    # BEVESTIGD: mijn.host .starter draait MariaDB 11.8.x (server: 11.8.8-MariaDB-cll-lve).
    image: mariadb:11.8
    container_name: alv-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-alv}
      MARIADB_USER: ${DB_USER:-alv}
      MARIADB_PASSWORD: ${DB_PASSWORD:-alv_dev_pw}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pw}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # LET OP: productie-sql_mode is NIET strict. We forceren hier GEEN afwijkende
      # serverstand; de app zet per verbinding zelf een vaste strict sql_mode
      # (STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION) zodat dev == prod, ongeacht default.
      - --innodb-flush-log-at-trx-commit=1
    volumes:
      - alv-db-data:/var/lib/mysql
      - alv-db-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      alv-seed-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [alv-net]

  alv-app:
    build:
      context: ../app
      dockerfile: ../infra/Dockerfile
    container_name: alv-app
    restart: unless-stopped
    # Pariteit met .starter: 2 cores / 2 GB RAM. Een geheugenlek valt zo lokaal net zo hard op.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    cpus: 2
    mem_limit: 2g
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: alv-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-alv}
      DB_USER: ${DB_USER:-alv}
      DB_PASSWORD: ${DB_PASSWORD:-alv_dev_pw}
      # App zet per verbinding: SET SESSION sql_mode='STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION'
      DB_SESSION_SQL_MODE: "STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
      # App draait als EEN proces (geen cluster/PM2-fork) — spiegelt shared hosting/Passenger.
      APP_SINGLE_PROCESS: "true"
      # Vertrouw alleen de proxyheader van alv-proxy (geverifieerd client-IP).
      TRUST_PROXY: "1"
    depends_on:
      alv-db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [alv-net]

  alv-proxy:
    # Bootst LiteSpeed/DirectAdmin-proxy na: zet X-Forwarded-For + TLS lokaal.
    image: caddy:2-alpine
    container_name: alv-proxy
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - alv-caddy-data:/data
    depends_on:
      alv-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [alv-net]

  alv-adminer:
    image: adminer:latest
    container_name: alv-adminer
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: alv-db
    depends_on:
      - alv-db
    networks: [alv-net]

  alv-loadtest:
    image: grafana/k6:latest
    container_name: alv-loadtest
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
    # Simuleert 120+ deelnemers + gelijktijdige stembursts (Gemini).
    command: run /scripts/vote-burst.js
    environment:
      TARGET: https://alv-proxy
      K6_INSECURE_SKIP_TLS_VERIFY: "true"
    depends_on:
      alv-proxy:
        condition: service_healthy
    networks: [alv-net]

volumes:
  alv-db-init:
  alv-db-data:
  alv-caddy-data:

networks:
  alv-net:
    driver: bridge
